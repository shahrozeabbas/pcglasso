name: CI

# Build the extension on every platform and run a smoke test, so compile
# breakage (notably the pyo3/rust-numpy binding surface) is caught before a
# release is ever tagged. Tags do not match the branch filter, so this does
# not double-run alongside the release workflow.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto

      - name: Install and smoke test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import numpy as np
          import pcglasso

          X = np.random.default_rng(0).standard_normal((100, 8))
          for method in ("primal", "dual"):
              m = pcglasso.PCGLasso(alpha=0.1, method=method).fit(X)
              P = m.precision_
              assert P.shape == (8, 8), P.shape
              assert np.allclose(P, P.T, atol=1e-8), "precision not symmetric"
              assert m.partial_correlation_.shape == (8, 8)
              assert m.adjacency_.dtype == bool
              print(f"{method}: n_iter={m.n_iter_} converged={m.converged_}")

          # Warm start across a similar problem.
          m = pcglasso.PCGLasso(alpha=0.1, warm_start=True)
          m.fit(X)
          m.fit(X + 0.01)
          print("warm start OK")
          PY
